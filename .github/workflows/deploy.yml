name: CI/CD Pipeline — Build, Push e Deploy Automático

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'MANUAL_*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: maxwellrodriguesferreira/apoio-tratamento

jobs:
  # ============================================================================
  # 1. BUILD & PUSH: Compilação e envio da imagem ao Docker Hub
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx (Cache & Multi-stage)
        uses: docker/setup-buildx-action@v3

      - name: 3. Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Extrair Metadados e Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1
            type=sha,format=short,prefix=sha-

      - name: 5. Build e Push da Imagem Unificada
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. DEPLOY: Atualização Automática no Cluster / Portainer
  # ============================================================================
  deploy:
    name: Trigger Deploy no Cluster / Portainer
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # Opção A: Deploy via Webhook do Portainer (Mais simples e recomendada)
      - name: Deploy via Portainer Webhook
        if: "${{ secrets.PORTAINER_WEBHOOK_URL != '' }}"
        run: |
          echo "Disparando Webhook de atualização no Portainer..."
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          echo "Webhook disparado com sucesso!"

      # Opção B: Rollout direto no Kubernetes via SSH na VPS
      - name: Deploy via SSH (kubectl rollout restart)
        if: "${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Atualizando pods no Kubernetes..."
            kubectl rollout restart deployment/contador-apoio-app -n contador-apoio
            kubectl rollout status deployment/contador-apoio-app -n contador-apoio --timeout=120s
            echo "Deploy concluído com sucesso!"
