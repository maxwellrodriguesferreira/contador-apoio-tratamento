name: CI/CD Pipeline — Build Multi-Arch e Deploy Contínuo (Docker Hub & Watchtower)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README*.md'
      - 'MANUAL_*.md'
      - 'docs/**'
      - '.gitignore'
      - '*.pdf'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: maxwellrodriguesferreira/apoio-tratamento

jobs:
  # ============================================================================
  # 1. BUILD & PUSH: Compilação Multi-Arquitetura (VPS AMD64 + Raspberry ARM64)
  # ============================================================================
  build-and-push:
    name: Build & Push Multi-Plataforma
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar QEMU (Emulador para arquitetura ARM64 da Raspberry)
        uses: docker/setup-qemu-action@v3

      - name: 3. Configurar Docker Buildx (Cache e Multi-arquitetura)
        uses: docker/setup-buildx-action@v3

      - name: 4. Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Extração de Metadados e Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1
            type=sha,format=short,prefix=sha-

      - name: 6. Compilação e Envio da Imagem (AMD64 + ARM64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. NOTIFICAÇÃO DO WATCHTOWER: Disparo Opcional via Webhook HTTP
  # ============================================================================
  trigger-watchtower:
    name: Notificar Watchtower (Opcional via Webhook)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Disparar Webhook do Watchtower
        if: "${{ secrets.WATCHTOWER_WEBHOOK_URL != '' }}"
        run: |
          echo "Disparando atualização imediata no Watchtower..."
          curl -f -X POST "${{ secrets.WATCHTOWER_WEBHOOK_URL }}" \
            ${{ secrets.WATCHTOWER_HTTP_API_TOKEN != '' && format('-H "Authorization: Bearer {0}"', secrets.WATCHTOWER_HTTP_API_TOKEN) || '' }} || true
          echo "Sinal enviado com sucesso!"
