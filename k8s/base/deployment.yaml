apiVersion: apps/v1
kind: Deployment
metadata:
  name: contador-apoio-app
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: contador-apoio
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: contador-apoio-tratamento
spec:
  replicas: 1
  # Estratégia Recreate obrigatória devido ao volume ReadWriteOnce local do SQLite em /app/data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: contador-apoio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contador-apoio
        app.kubernetes.io/component: application
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          # Imagem oficial multi-arch (linux/amd64 e linux/arm64)
          image: maxwellrodriguesferreira/apoio-tratamento:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: contador-apoio-config
            - secretRef:
                name: contador-apoio-secret
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          # Recursos calibrados para Raspberry Pi 4 (ARM64) e VPS Cloud (x86_64)
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: contador-apoio-data-pvc
