apiVersion: v1
kind: Secret
metadata:
  name: contador-apoio-secret
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: contador-apoio
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: contador-apoio-tratamento
type: Opaque
stringData:
  # Cloudflare D1 (Banco de Dados em Nuvem Principal Serverless)
  CLOUDFLARE_ACCOUNT_ID: "seu_cloudflare_account_id_aqui"
  CLOUDFLARE_DATABASE_ID: "seu_cloudflare_database_id_aqui"
  CLOUDFLARE_API_TOKEN: "seu_cloudflare_api_token_aqui"

  # Google Gemini AI Key (IA para Análise Farmacêutica)
  GEMINI_API_KEY: "sua_gemini_api_key_aqui"

  # Credenciais Iniciais de Administrador
  ADMIN_EMAIL: "admin@maxwelldev.online"
  ADMIN_PASSWORD: "DefinaSuaSenhaSeguraAqui123$"

  # Credenciais Opcionais de Atendente
  ATENDENTE_EMAIL: ""
  ATENDENTE_PASSWORD: ""

  # Rate Limiting & Cache Distribuído (Upstash Redis - Opcional)
  # Exemplo: rediss://default:senha@endpoint.upstash.io:6379
  REDIS_URL: ""
