apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contador-apoio-ingress
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: contador-apoio
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: contador-apoio-tratamento
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apoio.seudominio.com.br
      secretName: contador-apoio-tls
  rules:
    - host: apoio.seudominio.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contador-apoio-service
                port:
                  name: http
