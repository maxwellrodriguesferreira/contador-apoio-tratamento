apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contador-apoio-ingress
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: contador-apoio
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: contador-apoio-tratamento
  annotations:
    # Traefik Ingress Controller
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Cert-Manager para emissão e renovação automática de certificado Let's Encrypt
    cert-manager.io/issuer: letsencrypt-contador-apoio
    # Alternativa caso utilize ClusterIssuer global:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # Alternativa caso seu Traefik utilize o resolver ACME interno (sem cert-manager):
    # traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - maxwelldev.online
        - www.maxwelldev.online
      secretName: contador-apoio-tls
  rules:
    - host: maxwelldev.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contador-apoio-service
                port:
                  name: http
    - host: www.maxwelldev.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contador-apoio-service
                port:
                  name: http
