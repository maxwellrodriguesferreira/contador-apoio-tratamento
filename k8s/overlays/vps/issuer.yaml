apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-contador-apoio
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: contador-apoio
    app.kubernetes.io/component: pki
    app.kubernetes.io/part-of: contador-apoio-tratamento
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # E-mail para registro ACME e alertas de renovação/expiração de certificados SSL
    email: maxwellferreira@proton.me
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            # Traefik é o Ingress Controller nativo pré-instalado no K3s
            class: traefik
