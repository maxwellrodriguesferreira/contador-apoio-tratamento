# ==============================================================================
# Cloudflare Tunnel Connector para Kubernetes (cloudflared)
# Especialmente desenvolvido para: RASPBERRY PI 4 (Borda / Farmácia / CGNAT)
# Domínio pessoal configurado: maxwelldev.online (ou subdomínio associado)
# ==============================================================================
# Vantagens:
# 1. Não necessita abrir portas 80/443 no roteador físico da farmácia.
# 2. Contorna 100% de restrições de CGNAT de operadoras residenciais e comerciais.
# 3. Estabelece canal TLS de saída (outbound) seguro para os data centers da Cloudflare.
# 4. Tráfego externo recebido em https://maxwelldev.online é entregue internamente
#    direto ao service http://contador-apoio-service.contador-apoio.svc.cluster.local:80.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: contador-apoio
  labels:
    app.kubernetes.io/name: cloudflare-tunnel
    app.kubernetes.io/component: edge-ingress
    app.kubernetes.io/part-of: contador-apoio-tratamento
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
                  optional: false
          # Recursos enxutos para preservar a memória da Raspberry Pi 4
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
