# ==============================================================================
# Configuração de Referência: Proxy Reverso Nginx no Host / VPS
# ==============================================================================
# Use este modelo se estiver utilizando Nginx tradicional na VPS apontando para
# o contêiner unificado (contador-apoio-app) na rede shared-network.
#
# Para Nginx Proxy Manager (NPM):
#   - Forward Hostname / IP: contador-apoio-app
#   - Forward Port: 3000
#   - Websockets Support: Ativado
#   - Block Common Exploits: Ativado
# ==============================================================================

server {
    listen 80;
    server_name apoio.suadrogaria.com.br; # Substitua pelo seu domínio

    client_max_body_size 25M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Encaminhamento transparente para o contêiner unificado
    location / {
        proxy_pass http://contador-apoio-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
    }
}
