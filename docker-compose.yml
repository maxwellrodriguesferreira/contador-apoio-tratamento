services:
  # Aplicação Unificada Single-Container (Frontend React SPA + Backend Express API + D1/SQLite Engine)
  app:
    image: maxwellrodriguesferreira/apoio-tratamento:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contador-apoio-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-${FRONTEND_PORT:-3000}}:${PORT:-3000}"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=${PORT:-3000}
      - CLIENT_BUILD_PATH=/app/client
      - DATABASE_DIR=/app/data

      # Rate Limiting com Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-5}
      - LOGIN_RATE_LIMIT_WINDOW_MS=${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}

      # Repasse seguro de variáveis de ambiente
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_DATABASE_ID=${CLOUDFLARE_DATABASE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_DEFAULT_MODEL=${GEMINI_DEFAULT_MODEL:-gemini-3.6-flash}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ATENDENTE_EMAIL=${ATENDENTE_EMAIL:-}
      - ATENDENTE_PASSWORD=${ATENDENTE_PASSWORD:-}
    volumes:
      - d1_sqlite_data:/app/data
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shared_network

  # Redis para Armazenamento Distribuído de Sessões e Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: contador-apoio-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:-redis123}"'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a \"$${REDIS_PASSWORD:-redis123}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shared_network

volumes:
  d1_sqlite_data:
    name: contador_apoio_d1_data
  redis_data:
    name: contador_apoio_redis_data

networks:
  # Rede Docker externa compartilhada com o Nginx Proxy Manager (rede-proxy)
  shared_network:
    name: ${DOCKER_SHARED_NETWORK:-rede-proxy}
    external: true
