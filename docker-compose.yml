services:
  # 1. API Backend (Cloudflare D1 Engine & Google Gemini)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: contador-apoio-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - PORT=4000
      # Repasse seguro de variáveis de ambiente (sem expor credenciais no repositório)
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_DATABASE_ID
      - CLOUDFLARE_API_TOKEN
      - CF_ACCOUNT_ID
      - CF_D1_DB_ID
      - CF_D1_TOKEN
      - GEMINI_API_KEY
      - GEMINI_DEFAULT_MODEL
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - APP_ADMIN_MAIL
      - APP_ADMIN_PASS
      - ATENDENTE_EMAIL
      - ATENDENTE_PASSWORD
      - DATABASE_DIR=/app/data
    volumes:
      - d1_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal_network
      - shared_network

  # 2. Frontend Web (React 18 + Vite + Nginx Alpine)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contador-apoio-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_network
      - shared_network

volumes:
  d1_sqlite_data:
    name: contador_apoio_d1_data

networks:
  # Rede privada interna para comunicação direta entre serviços da aplicação
  internal_network:
    name: contador_apoio_internal
    driver: bridge

  # Rede Docker compartilhada com outros contêineres e o Proxy Nginx central
  shared_network:
    name: ${DOCKER_SHARED_NETWORK:-shared-network}
    external: true
